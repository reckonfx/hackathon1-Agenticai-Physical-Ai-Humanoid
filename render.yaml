services:
- type: web
  name: humanoid-ai-backend
  env: python
  region: frankfurt  # Choose your preferred region
  buildCommand: pip install -r backend/requirements.txt
  startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
  envVars:
  - key: PORT
    value: 10000
  - key: QDRANT_URL
    sync: false  # This will need to be set manually in the Render dashboard
  - key: QDRANT_API_KEY
    sync: false  # This will need to be set manually in the Render dashboard
  - key: NEON_DB_URL
    sync: false  # This will need to be set manually in the Render dashboard
  - key: GEMINI_API_KEY
    sync: false  # This will need to be set manually in the Render dashboard
  disk:  # Optional persistent disk
    name: data
    mountPath: /app/data
    sizeGB: 1